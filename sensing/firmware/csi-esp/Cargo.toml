[package]
name = "csi-esp"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
tx = []
rx = []
# Both capabilities with a known-peer leader/responder policy.
pair = ["tx", "rx"]

[dependencies]
csi-node = { path = "../../crates/csi-node" }
csi-protocol = { path = "../../crates/csi-protocol", default-features = false }
esp-hal = { version = "=1.2.2", default-features = false, features = ["esp32", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32", "embassy", "esp-alloc", "esp-radio"] }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = ["esp32", "wifi", "csi", "sniffer", "esp-now", "esp-alloc", "unstable"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32"] }
esp-alloc = "=0.11.0"
esp-backtrace = { version = "=0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32", "uart", "critical-section"] }
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"
portable-atomic = { version = "1.13.0", default-features = false, features = ["critical-section"] }
