[workspace]
resolver = "3"
members = [
    "crates/csi-protocol",
    "crates/csi-node",
    "server/csi-host",
    "server/csi",
]
# Separate workspace: esp toolchain, Xtensa target, build-std.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
csi-protocol = { path = "crates/csi-protocol", default-features = false }
csi-host = { path = "server/csi-host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-serial = { version = "5", default-features = false }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
