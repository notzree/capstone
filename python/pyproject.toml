[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-csi"
version = "0.1.0"
description = "Thin Python reader for the Rust CSI acquisition boundary"
requires-python = ">=3.10"
dependencies = ["pyarrow>=20", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
