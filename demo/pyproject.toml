[project]
name = "csi-heartbeat"
version = "0.1.0"
description = "ESP32 CSI capture and experimental heart-rate feasibility analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "pyserial>=3.5,<4", "esptool>=4.8,<6"]

[project.scripts]
csi-heartbeat = "csi_heartbeat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
